<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Yoga con Ximena</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3d8;--card:#f8f1ea;--terra:#b8715c;--brown:#7a4a33;--olive:#8a8677;--ink:#4a2e20;--line:#d9c6b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Work Sans',sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 64px}
h1{font-family:Marcellus,serif;font-weight:400;color:var(--brown);font-size:28px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--olive);font-size:14px}.hidden{display:none}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:8px 14px;background:var(--terra);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--brown);border:1px solid var(--brown)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;margin:6px 0}
select{width:auto;margin:0}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;background:transparent;color:var(--brown);border:1px solid var(--line)}
.tabs button.on{background:var(--brown);color:#fff}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--line)}
.p{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:608px;z-index:9;background:#fff;border:1px solid var(--terra);border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(74,46,32,.25)}
</style>
</head>
<body>
<main>
  <h1>Panel de Ximena</h1>
  <div id="msg" class="hidden" role="status"></div>

  <section id="auth" class="card hidden">
    <input id="email" type="email" placeholder="Correo" autocomplete="email">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="go" style="margin-top:8px">Entrar</button>
  </section>

  <section id="deny" class="card hidden">
    <p>Esta cuenta no tiene permiso de administradora.</p><button id="out2" class="alt">Salir</button>
  </section>

  <section id="app" class="hidden">
    <div class="row"><span class="muted">Sesión de administradora</span><button id="out" class="alt">Salir</button></div>
    <div class="tabs"><button id="t1" class="on">Clases</button><button id="t2">Alumnas</button></div>
    <div id="v1"></div>
    <div id="v2" class="hidden"><input id="q" placeholder="Buscar por nombre o correo"><div id="list"></div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Pega aquí los MISMOS datos que en reservas.html (Supabase > Project Settings > API)
const SUPABASE_URL = 'PEGA_AQUI_TU_PROJECT_URL';
const SUPABASE_KEY = 'PEGA_AQUI_TU_ANON_PUBLIC_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ = 'America/Mexico_City';
const fmt = d => new Date(d).toLocaleString('es-MX', {timeZone:TZ, weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
const day = d => new Date(d).toLocaleDateString('es-MX', {timeZone:TZ, day:'numeric', month:'short'});
const ST = {booked:'Reservada', attended:'Asistió', no_show:'No llegó'};
let students = [];

function say(t){ const m=$('msg'); m.textContent=t; m.classList.remove('hidden'); clearTimeout(say.t); say.t=setTimeout(()=>m.classList.add('hidden'),7000); }
function show(id){ ['auth','deny','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id)); }
function tab(n){ $('v1').classList.toggle('hidden',n!==1); $('v2').classList.toggle('hidden',n!==2);
  $('t1').classList.toggle('on',n===1); $('t2').classList.toggle('on',n===2); }
$('t1').onclick=()=>tab(1); $('t2').onclick=()=>tab(2);
$('go').onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email:$('email').value.trim(), password:$('pass').value});
  if (error) return say(error.message); boot();
};
const exit = async () => { await sb.auth.signOut(); show('auth'); };
$('out').onclick = exit; $('out2').onclick = exit;
$('q').oninput = renderStudents;

async function boot(){
  const {data:{user}} = await sb.auth.getUser();
  if (!user) return show('auth');
  const {data:ok} = await sb.rpc('is_admin');
  if (!ok) return show('deny');
  show('app'); load();
}

async function load(){
  const [c, s] = await Promise.all([sb.rpc('admin_classes'), sb.rpc('admin_students')]);
  if (c.error || s.error) return say('Error: ' + (c.error || s.error).message);
  students = s.data || [];
  $('v1').innerHTML = (c.data || []).map(k => {
    const ppl = k.people || [], n = ppl.length;
    return `<div class="card"><div class="row"><b>${esc(k.name)}</b><span class="tag">${n}/${k.capacity}</span></div>
      <span class="muted">${esc(fmt(k.starts_at))}</span>` +
      (n ? ppl.map(p => `<div class="p"><div class="row"><div>${esc(p.name || p.email)}${p.trial ? ' <span class="tag">prueba</span>' : ''}<br>
        <span class="muted">${esc(p.email)} · ${ST[p.status]}</span></div>
        <div class="acts">${p.status === 'booked'
          ? `<button data-b="${p.booking_id}" data-s="attended">Asistió</button><button class="alt" data-b="${p.booking_id}" data-s="no_show">No llegó</button><button class="alt" data-b="${p.booking_id}" data-s="cancelled" data-ask="1">Quitar</button>`
          : `<button class="alt" data-b="${p.booking_id}" data-s="booked">Deshacer</button>`}</div></div></div>`).join('')
        : '<p class="muted" style="margin:8px 0 0">Sin reservas todavía.</p>') + '</div>';
  }).join('') || '<p class="muted">No hay clases próximas.</p>';
  renderStudents();
}

function renderStudents(){
  const q = $('q').value.toLowerCase();
  $('list').innerHTML = students.filter(s => (s.name + ' ' + s.email).toLowerCase().includes(q)).map(s =>
    `<div class="card"><b>${esc(s.name || '(sin nombre)')}</b><br><span class="muted">${esc(s.email)}</span><br>
    Clases disponibles: <b>${s.credits}</b>${s.expires_at ? ` <span class="muted">· vence ${esc(day(s.expires_at))}</span>` : ''}
    ${s.trial_used ? ' <span class="tag">usó su prueba</span>' : ''}
    <div class="row" style="margin-top:10px"><select data-sel="${s.user_id}"><option value="4">4 clases</option><option value="8">8 clases</option><option value="12">12 clases</option><option value="99">Ilimitadas</option></select>
    <button data-u="${s.user_id}" data-n="${esc(s.name || s.email)}">Cargar paquete</button></div></div>`).join('') || '<p class="muted">Sin resultados.</p>';
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.b) {
    if (b.dataset.ask && !confirm('¿Quitar esta reserva? Se le devuelve la clase.')) return;
    const {error} = await sb.rpc('admin_set_status', {p_booking:b.dataset.b, p_status:b.dataset.s});
    say(error ? error.message : 'Listo ✓'); load();
  }
  if (b.dataset.u) {
    const sel = document.querySelector(`select[data-sel="${b.dataset.u}"]`), total = +sel.value;
    if (!confirm(`¿Cargar ${total === 99 ? 'paquete ilimitado' : total + ' clases'} a ${b.dataset.n}? Vence en 4 semanas.`)) return;
    const {error} = await sb.rpc('admin_add_package', {p_user:b.dataset.u, p_total:total, p_days:28});
    say(error ? error.message : 'Paquete cargado ✓'); load();
  }
});
boot();
</script>
</body>
</html>
